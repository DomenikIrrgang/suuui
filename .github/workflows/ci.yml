name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub releases
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # one wowlua for checks, tests and the release (latest broke 0.10.0's
      # publish on tests that passed under the one used locally)
      - uses: DomenikIrrgang/wowlua/.github/actions/setup-wowlua@main
        with: { version: v0.13.15 }
      - uses: actions/cache@v4
        with:
          path: ~/.wowlua/cache
          key: wowlua-${{ hashFiles('wowlua.lock') }}
      - run: wowlua build --release --locked --message-format github
      # the whole suite on every PR and push (a tag's publish runs it itself)
      - if: "!startsWith(github.ref, 'refs/tags/')"
        run: wowlua test --locked --message-format github
      - if: startsWith(github.ref, 'refs/tags/')
        run: wowlua publish
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Post the release to Discord
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true # a Discord hiccup doesn't fail a published release
        run: node .github/scripts/discord-release.mjs
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          DISCORD_RELEASE_ROLE_ID: "1560955269935005788" # @Release pings
